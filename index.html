
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px;
  font-family: Arial, sans-serif;
  background: #f0f3f8;
}

.container {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #0001;
}

h2 { color: #164b83; }

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  padding: 11px 18px;
  border: 0;
  border-radius: 5px;
  background: #1769aa;
  color: white;
  cursor: pointer;
  margin: 5px 0;
}

.logout { background: #d93636; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

td, th {
  border: 1px solid #ddd;
  padding: 10px;
  text-align: left;
}

th {
  background: #1769aa;
  color: white;
}

#message { color: #1769aa; }

.hidden { display: none; }

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div class="container" id="loginPage">

<h2>Admin Login</h2>

<p>Student Management System</p>

<form id="loginForm">

<input
  id="email"
  type="email"
  placeholder="Admin Email"
  required>

<input
  id="password"
  type="password"
  placeholder="Password"
  required>

<button type="submit">Login</button>

</form>

<p id="loginMessage"></p>

</div>


<!-- ADMIN DASHBOARD -->

<div class="container hidden" id="dashboard">

<h2>Student Management Dashboard</h2>

<p id="adminEmail"></p>

<button class="logout" onclick="logout()">
Logout
</button>

<hr>

<h3>Register Student</h3>

<form id="studentForm">

<input
  id="full_name"
  placeholder="Student Full Name"
  required>

<input
  id="student_email"
  type="email"
  placeholder="Student Email">

<input
  id="course"
  placeholder="Course Name"
  required>

<button type="submit">Save Student</button>

</form>

<p id="message"></p>

<h3>Student Records</h3>

<button onclick="loadStudents()">
Refresh
</button>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Course</th>
<th>Action</th>
</tr>
</thead>

<tbody id="studentList"></tbody>

</table>

</div>


<script>

// 1. DATABASE CONNECTION

const SUPABASE_URL = "https://iooqbufnqffdmkymiilg.supabase.co";
const SUPABASE_KEY = "sb_publishable_N-go2PwyZ2LaUQIICiB-CA_3suDsXdA";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// 2. CHECK LOGIN STATUS

function showLogin() {
  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("dashboard")
    .classList.add("hidden");
}

function showDashboard(user) {
  document.getElementById("loginPage")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.remove("hidden");

  document.getElementById("adminEmail")
    .textContent = "Logged in: " + user.email;

  loadStudents();
}


// 3. ADMIN LOGIN

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    document.getElementById("loginMessage")
      .textContent = "Login Failed: " + error.message;
    return;
  }

  document.getElementById("loginMessage")
    .textContent = "";

  showDashboard(data.user);

});


// 4. CHECK EXISTING SESSION

async function checkSession() {

  const { data, error } = await db.auth.getSession();

  if (error || !data.session) {
    showLogin();
    return;
  }

  showDashboard(data.session.user);
}


// 5. LOGOUT

async function logout() {

  const { error } = await db.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  document.getElementById("studentList").innerHTML = "";

  showLogin();

}


// 6. SAVE STUDENT

document.getElementById("studentForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const full_name =
    document.getElementById("full_name").value.trim();

  const email =
    document.getElementById("student_email").value.trim();

  const course =
    document.getElementById("course").value.trim();

  if (!full_name || !course) {
    alert("Please enter required details.");
    return;
  }

  const { error } = await db
    .from("students")
    .insert([{ full_name, email, course }]);

  if (error) {
    document.getElementById("message")
      .textContent = "Error: " + error.message;
    return;
  }

  document.getElementById("message")
    .textContent = "Student Saved Successfully!";

  this.reset();

  loadStudents();

});


// 7. DISPLAY STUDENTS

async function loadStudents() {

  const { data, error } = await db
    .from("students")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    document.getElementById("message")
      .textContent = "Error: " + error.message;
    return;
  }

  const list = document.getElementById("studentList");

  list.innerHTML = "";

  data.forEach(student => {

    const tr = document.createElement("tr");

    [
      student.id,
      student.full_name,
      student.email || "",
      student.course || ""
    ].forEach(value => {

      const td = document.createElement("td");

      td.textContent = value;

      tr.appendChild(td);

    });

    const action = document.createElement("td");

    const btn = document.createElement("button");

    btn.textContent = "Delete";
    btn.style.background = "#d93636";

    btn.onclick = () => deleteStudent(student.id);

    action.appendChild(btn);

    tr.appendChild(action);

    list.appendChild(tr);

  });

}


// 8. DELETE STUDENT

async function deleteStudent(id) {

  if (!confirm("Are you sure you want to delete?")) {
    return;
  }

  const { error } = await db
    .from("students")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Student Deleted Successfully!");

  loadStudents();

}


// 9. START WEBSITE

checkSession();

</script>

</body>
</html>
